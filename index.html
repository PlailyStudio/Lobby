<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Plaily Studio와 대학 경쟁률을 외부 브라우저에서 엽니다." />
    <title>Plaily Studio | 링크 선택</title>
    <link rel="stylesheet" href="styles.css?v=ae2a9ab" />
    <script src="script.js?v=no-guide-1" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <span class="wordmark">
          Plaily Studio
        </span>
      </header>

      <section class="content" aria-live="polite">
        <img class="loading-image" src="assets/loading-penguin.png" alt="" />

        <h1>어디로 이동할까요?</h1>
        <p class="description">버튼을 누르면 외부 브라우저로 열어요.</p>

        <div class="destination-buttons">
          <div class="destination-group">
            <button class="primary-button" id="open-button" type="button" data-destination="https://plailystudio.itch.io" aria-describedby="school-wifi-note">
              게임 아카이브 열기
            </button>
            <p class="button-note" id="school-wifi-note">학교 와이파이로는 접속이 불가할 수 있어요.</p>
          </div>
          <button class="primary-button competition-button" id="competition-button" type="button" data-destination="https://univ-comp-rate.ddayul.workers.dev/">
            관심 대학 경쟁률 모아보기
          </button>
        </div>
        <p class="recommendation">앱에 따라 외부 브라우저 열기가 제한될 수 있어요.</p>
      </section>

    </main>
  </body>
</html>
