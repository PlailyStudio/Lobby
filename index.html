<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Plaily Studio를 기본 브라우저에서 엽니다." />
    <title>Plaily Studio 열기</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="https://plailystudio.itch.io" aria-label="Plaily Studio 홈으로 이동">
          Plaily Studio
        </a>
      </header>

      <section class="content" aria-live="polite">
        <img class="loading-image" src="assets/loading-penguin.png" alt="" />

        <h1>브라우저에서 여는 중</h1>
        <p class="description">잠시만 기다려 주세요.</p>

        <div class="progress" aria-label="페이지 이동 중"><span></span></div>

        <button class="primary-button" id="open-button" type="button">
          바로 열기
        </button>
        <button class="text-button" id="help-button" type="button">열리지 않나요?</button>
      </section>

      <div class="overlay" id="guide-overlay" role="dialog" aria-modal="true" aria-labelledby="guide-title" hidden>
        <button class="backdrop" id="backdrop" type="button" aria-label="안내 닫기"></button>
        <section class="guide">
          <div class="guide-heading">
            <div>
              <p id="platform-label">인앱 브라우저에서 열었어요</p>
              <h2 id="guide-title">외부 브라우저에서 열기</h2>
            </div>
            <button class="close-button" id="close-button" type="button" aria-label="안내 닫기">×</button>
          </div>

          <ol class="steps">
            <li><span>1</span><p>오른쪽 위의 <strong>···</strong> 또는 <strong>공유</strong>를 누르세요.</p></li>
            <li><span>2</span><p><strong>외부 브라우저에서 열기</strong>를 선택하세요.</p></li>
          </ol>

          <button class="copy-button" id="copy-button" type="button">주소 복사</button>
        </section>
      </div>
    </main>
  </body>
</html>
